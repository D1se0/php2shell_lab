; ============================================================================
;  PHP2Shell Lab - configuracion de referencia (identica en ambos contenedores)
;  ------------------------------------------------------------------------
;  Reproduce la configuracion usada en el analisis de referencia:
;    - memory_limit=16M  : lo bastante bajo para que el nombre de campo
;      sobredimensionado agote la memoria durante el parseo del POST.
;      (Con el default 128M el trigger tambien funciona usando un nombre
;      de campo proporcionalmente mayor: es cuestion de tamano, no de magia.)
;    - post_max_size=64M : admite el request desencadenante (~3.5 MB de cuerpo)
;    - display_errors=On : el fatal error del OOM es visible en el body HTTP,
;      util para la demo y para la deteccion.
;  NOTA: el resto de directivas quedan con sus valores por defecto.
; ============================================================================

memory_limit = 16M
post_max_size = 64M
upload_max_filesize = 2M
display_errors = On
log_errors = On
