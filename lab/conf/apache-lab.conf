# ============================================================================
#  PHP2Shell Lab - configuracion Apache (mpm_prefork)
#  ------------------------------------------------------------------------
#  El pool de workers se reduce al minimo para que la demo sea determinista:
#  los requests sucesivos tienden a entrar por el mismo proceso, y un
#  segfault del worker queda directamente visible en el error log
#  (AH00052: child pid ... exit signal Segmentation fault (11)).
# ============================================================================

<IfModule mpm_prefork_module>
    StartServers        1
    MinSpareServers     1
    MaxSpareServers     1
    ServerLimit         1
    MaxRequestWorkers   1
    MaxConnectionsPerChild 0
</IfModule>

# KeepAlive activado para que los requests sucesivos de la prueba
# tiendan al mismo worker (mas determinismo).
KeepAlive On
KeepAliveTimeout 30
MaxKeepAliveRequests 0
